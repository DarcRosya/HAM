<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HAM Card Game</title>
</head>

<body>
  <div id="coin-toss-overlay" aria-hidden="true">
    <div class="coin-toss-stage">
      <div class="coin">
        <div class="coin-face coin-front">
          <span id="coin-front-text" class="coin-label">YOU</span>
        </div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-face coin-back">
          <span id="coin-back-text" class="coin-label">OPPONENT</span>
        </div>
      </div>
      <div class="coin-toss-caption">Deciding first turn</div>
    </div>
  </div>

  <div class="game-board">

    <div class="top-zone">
      <div class="hand enemy-hand" id="opp-hand">
      </div>
      <div class="player-info">
        <div class="username">12345678901234567890</div>
        <div class="avatar-wrapper">
          <img src="/assets/images/avatar-enemy.png" alt="Enemy Avatar" class="avatar" id="opp-avatar">
          <div class="health-indicator">
            <img src="/assets/images/heart.png" alt="HP" class="heart-img">
            <span class="health-text" id="opp-hp">20</span>
          </div>
        </div>
        <div class="mana-bar">
          <span class="mana-text" id="opp-mana">3 / 3</span>
        </div>
      </div>
    </div>

    <div class="battlefield">
      <div class="decks-column">
        <div class="his-deck" id="opp-deck">30</div>
        <div class="my-deck" id="player-deck" data-count="30"></div>
        <div id="fatigue-info" class="hidden">Fatigue: <span id="fatigue-value">0</span></div>
      </div>

      <div class="active-cards-column">
        <div class="active-group enemy-active-group" id="opp-table">
        </div>

        <div class="active-group my-active-group" id="my-table">
        </div>
      </div>

      <div class="actions-column">
        <button class="text-btn" id="surrender-btn">SURRENDER</button>
        <button class="end-turn-btn" id="end-turn-btn">end of the turn</button>
      </div>
    </div>

    <div class="bottom-zone">
      <div class="player-info">
        <div class="username">12345678901234567890</div>
        <div class="avatar-wrapper">
          <img src="/assets/images/avatar-my.png" alt="My Avatar" class="avatar">
          <div class="health-indicator">
            <img src="/assets/images/heart.png" alt="HP" class="heart-img">
            <span class="health-text" id="player-hp">20</span>
          </div>
        </div>
        <div class="mana-bar">
          <span class="mana-text" id="player-mana">3 / 3</span>
        </div>
      </div>
      <div class="hand my-hand" id="hand-display">
      </div>
    </div>

  </div>

</body>

</html>
