<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HAM Card Game</title>
</head>

<body>
  <div id="coin-toss-overlay" aria-hidden="true">
    <div class="coin-toss-stage">
      <div class="coin">
        <div class="coin-face coin-front">
          <span id="coin-front-text" class="coin-label">YOU</span>
        </div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-layer"></div>
        <div class="coin-face coin-back">
          <span id="coin-back-text" class="coin-label">OPPONENT</span>
        </div>
      </div>
      <div class="coin-toss-caption">Deciding first turn</div>
    </div>
  </div>

  <div class="game-board">

    <div class="top-zone">
      <div class="hand enemy-hand">
        <img src="card-back.png" alt="Enemy Card" class="card">
        <img src="card-back.png" alt="Enemy Card" class="card">
        <img src="card-back.png" alt="Enemy Card" class="card">
        <img src="card-back.png" alt="Enemy Card" class="card">
        <img src="card-back.png" alt="Enemy Card" class="card">
      </div>
      <div class="player-info">
        <div class="username">12345678901234567890</div>
        <div class="avatar-wrapper">
          <img src="avatar-enemy.png" alt="Enemy Avatar" class="avatar">
          <div class="health-indicator">
            <img src="heart.png" alt="HP" class="heart-img">
            <span class="health-text">ХП</span>
          </div>
        </div>
        <div class="mana-bar">
          <span class="mana-text">3/6</span>
          <div class="mana-crystals">
            <div class="crystal active"></div>
            <div class="crystal active"></div>
            <div class="crystal active"></div>
            <div class="crystal empty"></div>
            <div class="crystal empty"></div>
            <div class="crystal empty"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="battlefield">
      <div class="decks-column">
        <div class="his-deck"></div>
        <div class="my-deck" data-count="six sevenn"></div>
      </div>

      <div class="active-cards-column">
        <div class="active-group enemy-active-group">
          <img src="card-front.png" alt="Active Enemy" class="active-card">
          <img src="card-front.png" alt="Active Enemy" class="active-card">
          <img src="card-front.png" alt="Active Enemy" class="active-card">
          <img src="card-front.png" alt="Active Enemy" class="active-card">
          <img src="card-front.png" alt="Active Enemy" class="active-card">
          <img src="card-front.png" alt="Active Enemy" class="active-card">
          <img src="card-front.png" alt="Active Enemy" class="active-card">
        </div>

        <div class="active-group my-active-group">
          <img src="card-front.png" alt="Active My" class="active-card">
          <img src="card-front.png" alt="Active My" class="active-card">
          <img src="card-front.png" alt="Active My" class="active-card">
          <img src="card-front.png" alt="Active My" class="active-card">
          <img src="card-front.png" alt="Active My" class="active-card">
          <img src="card-front.png" alt="Active My" class="active-card">
          <img src="card-front.png" alt="Active My" class="active-card">
        </div>
      </div>

      <div class="actions-column">
        <button class="text-btn">SURRENDER</button>
        <button class="end-turn-btn">end of the turn</button>
        <button class="text-btn">LEAVE</button>
      </div>
    </div>

    <div class="bottom-zone">
      <div class="player-info">
        <div class="username">12345678901234567890</div>
        <div class="avatar-wrapper">
          <img src="avatar-my.png" alt="My Avatar" class="avatar">
          <div class="health-indicator">
            <img src="heart.png" alt="HP" class="heart-img">
            <span class="health-text">ХП</span>
          </div>
        </div>
        <div class="mana-bar">
          <span class="mana-text">3/9</span>
          <div class="mana-crystals">
            <div class="crystal active"></div>
            <div class="crystal active"></div>
            <div class="crystal active"></div>
            <div class="crystal empty"></div>
            <div class="crystal empty"></div>
            <div class="crystal empty"></div>
            <div class="crystal empty"></div>
            <div class="crystal empty"></div>
            <div class="crystal empty"></div>
          </div>
        </div>
      </div>
      <div class="hand my-hand">
        <img src="card-back.png" alt="My Card" class="card">
        <img src="card-back.png" alt="My Card" class="card">
        <img src="card-back.png" alt="My Card" class="card">
        <img src="card-back.png" alt="My Card" class="card">
        <img src="card-back.png" alt="My Card" class="card">
      </div>
    </div>

  </div>

</body>

</html>
