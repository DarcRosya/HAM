<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HAM Card Game</title>
</head>

<body>

  <div class="main-container">

    <header class="player-bar">
      <div class="player-info">
        <img id="avatar" src="avatar.png" alt="Avatar" class="avatar">
        <div class="names">
          <h2 class="display-name"></h2>
          <p class="username"></p>
        </div>
      </div>
      <button class="edit-btn">EDIT</button>
    </header>

    <div class="play-section">
      <button class="play-btn">PLAY</button>
    </div>

    <section class="match-history">
      <h3 class="history-title">Match history</h3>
      <div id="history-list"></div>
    </section>
  </div>

  <div id="search-overlay" class="search-overlay hidden">
    <div class="search-content">

      <div class="animation-zone">
        <div class="spinner"></div>
        <img src="assets/images/ham-logo.png" class="spinning-logo" alt="Searching">
      </div>

      <div class="text-zone">
        <p id="search-tips"></p>
      </div>

      <button id="cancel-search-btn" class="cancel-btn">CANCEL</button>
    </div>
  </div>

  <script type="module" src="../scripts/lobby.js"></script>
</body>

</html>
