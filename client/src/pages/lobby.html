<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HAM Card Game</title>
  <link rel="stylesheet" href="../styles/lobby.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap"
    rel="stylesheet">
</head>

<body>

  <div class="main-container">

    <header class="player-bar">
      <div class="player-info">
        <img id="avatar" src="avatar.png" alt="Avatar" class="avatar">
        <div class="names">
          <h2 class="display-name">displayed name</h2>
          <p class="username">username</p>
        </div>
      </div>
      <button class="edit-btn">EDIT</button>
    </header>

    <div class="play-section">
      <button class="play-btn">PLAY</button>
    </div>

    <section class="match-history">
      <h3 class="history-title">Match history</h3>

      <div class="match-card victory">
        <div class="vs-block">
          <img id="avatar" src="avatar.png" class="mini-avatar">
          <span class="vs-text">VS</span>
          <img id="his-avatar" src="enemy1.png" class="mini-avatar">
          <span class="enemy-username">enemy_user1</span>
        </div>
        <div class="result-status">Victory</div>
        <div class="stats">
          <div class="mmr">+223</div>
          <div class="date-time">12.05.2026 dur:13:21</div>
        </div>
      </div>

      <div class="match-card defeat">
        <div class="vs-block">
          <img id="avatar" src="avatar.png" class="mini-avatar">
          <span class="vs-text">VS</span>
          <img id="his-avatar" src="enemy2.png" class="mini-avatar">
          <span class="enemy-username">enemy_user2</span>
        </div>
        <div class="result-status">Defeat</div>
        <div class="stats">
          <div class="mmr">-223</div>
          <div class="date-time">12.05.2026 dur:13:21</div>
        </div>
      </div>

      <div class="match-card victory">
        <div class="vs-block">
          <img id="avatar" src="avatar.png" class="mini-avatar">
          <span class="vs-text">VS</span>
          <img id="his-avatar" src="enemy3.png" class="mini-avatar">
          <span class="enemy-username">enemy_user3</span>
        </div>
        <div class="result-status">Victory</div>
        <div class="stats">
          <div class="mmr">+223</div>
          <div class="date-time">12.05.2026 dur:13:21</div>
        </div>
      </div>

    </section>
  </div>

  <script type="module" src="../scripts/lobby.js"></script>
</body>

</html>
